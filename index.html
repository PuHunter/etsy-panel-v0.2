<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>Etsy Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Etsy Panel</h1>
    <nav>
      <button data-tab="ozet" class="on">Özet</button>
      <button data-tab="siparisler">Siparişler</button>
      <button data-tab="urunler">Ürünler</button>
      <button data-tab="giderler">Giderler</button>
      <button data-tab="cevaplar">Hazır cevaplar</button>
    </nav>
  </header>
  <p class="notice">Örnek veri gösteriliyor. Etsy bağlantısı kurulunca gerçek siparişlerin görünecek.</p>
  <section class="params">
    <label>Dönem <select id="month"></select></label>
    <label>Vergi oranı (%) <input id="taxRate" type="number" step="0.5"></label>
    <button id="export" class="btn">Excel için dışa aktar</button>
  </section>
  <main id="view"></main>
  <script src="sample-data.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
